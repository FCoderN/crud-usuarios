<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h1 class="mb-4">Registro de Usuarios</h1>

  <!-- Formulario -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Agregar / Editar Usuario</h5>
      <input type="hidden" id="usuarioId">
      <div class="mb-3">
        <input type="text" id="nombre" class="form-control" placeholder="Nombre">
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email">
      </div>
      <div class="mb-3">
        <input type="number" id="edad" class="form-control" placeholder="Edad">
      </div>
      <button onclick="guardarUsuario()" class="btn btn-primary">Guardar</button>
      <button onclick="limpiarFormulario()" class="btn btn-secondary">Limpiar</button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Lista de Usuarios</h5>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Edad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
